<!doctype html>
<html lang="en" class="i18n-loading">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title></title>
    <link rel="icon" type="image/png" href="./waajacu_medical.png">
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <noscript><div class="bootstrap-error" data-i18n="bootstrap.javascript-required"></div></noscript>
    <div id="bootstrap-error" class="bootstrap-error hidden" role="alert"></div>
    <main class="app-shell" aria-busy="true" inert>
        <header class="page-header">
            <div class="app-brand">
                <img class="app-logo" src="./waajacu_medical.png" width="90" height="90" alt="">
                <div class="app-brand-copy">
                    <p class="eyebrow" data-i18n="brand.eyebrow"></p>
                    <h1 data-i18n="brand.name"></h1>
                    <p class="intro" data-i18n="brand.intro"></p>
                </div>
            </div>
            <div class="header-actions">
                <label class="language-selector" for="language-selector">
                    <span data-i18n="language.selector.label"></span>
                    <select id="language-selector" data-i18n-attrs="aria-label:language.selector.aria-label">
                        <option value="en" lang="en" data-i18n="language.options.en"></option>
                        <option value="es" lang="es" data-i18n="language.options.es"></option>
                        <option value="de" lang="de" data-i18n="language.options.de"></option>
                        <option value="zh" lang="zh-Hans" data-i18n="language.options.zh"></option>
                    </select>
                </label>
                <div id="server-status" class="server-status waiting" role="status" aria-live="polite">
                    <span class="status-dot" aria-hidden="true"></span>
                    <span data-i18n="common.status.loading-model"></span>
                </div>
            </div>
        </header>

        <div id="error" class="error hidden" role="alert"></div>

        <aside class="use-boundary" data-i18n-attrs="aria-label:boundary.aria-label">
            <strong data-i18n="boundary.title"></strong>
            <span data-i18n="boundary.description"></span>
            <a href="#model-information" data-i18n="boundary.link"></a>
        </aside>

        <nav class="app-tabs" role="tablist" data-i18n-attrs="aria-label:nav.tabs.aria-label">
            <button id="tab-explorer" class="active" type="button" role="tab" aria-selected="true" aria-controls="explorer-workspace" tabindex="0">
                <span class="app-tab-copy"><span data-i18n="nav.tabs.explorer.title"></span><small data-i18n="nav.tabs.explorer.description"></small></span>
                <canvas class="preset-thumbnail app-tab-visual app-tab-thumbnail" width="104" height="104" data-thumbnail-region="right-upper-limb" data-thumbnail-preset="hand-to-mouth" aria-hidden="true"></canvas>
            </button>
            <button id="tab-diagnosis" type="button" role="tab" aria-selected="false" aria-controls="diagnosis-workspace" tabindex="-1">
                <span class="app-tab-copy"><span data-i18n="nav.tabs.assessment.title"></span><small data-i18n="nav.tabs.assessment.description"></small></span>
                <svg class="app-tab-visual diagnosis-tab-icon" viewBox="0 0 80 80" aria-hidden="true">
                    <rect x="12" y="8" width="56" height="64" rx="3" />
                    <path d="M29 8V5h22v3M21 27l4 4 7-8M38 27h20M21 43l4 4 7-8M38 43h20M21 59l4 4 7-8M38 59h20" />
                </svg>
            </button>
        </nav>

        <section id="explorer-workspace" class="workspace" role="tabpanel" aria-labelledby="tab-explorer">
            <section class="viewer-panel panel" aria-labelledby="viewer-title">
                <header class="panel-header viewer-header">
                    <div>
                        <h2 id="viewer-title" data-i18n="explorer.viewer.title"></h2>
                        <p id="viewer-instructions" data-i18n="explorer.viewer.instructions"></p>
                    </div>
                </header>

                <div class="viewer-stage">
                    <div class="scene-wrap">
                        <div id="scene"></div>
                        <div class="scene-actions" role="group" data-i18n-attrs="aria-label:explorer.actions.group-label">
                            <button id="zoom-in" class="scene-action-button" type="button" data-i18n-attrs="aria-label:explorer.actions.zoom-in;data-tooltip:explorer.actions.zoom-in">
                                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
                            </button>
                            <button id="zoom-out" class="scene-action-button" type="button" data-i18n-attrs="aria-label:explorer.actions.zoom-out;data-tooltip:explorer.actions.zoom-out">
                                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14" /></svg>
                            </button>
                            <button id="mirror-view" class="scene-action-button" type="button" aria-pressed="false" data-i18n-attrs="aria-label:explorer.actions.mirror;data-tooltip:explorer.actions.mirror">
                                <svg viewBox="0 0 24 24" aria-hidden="true">
                                    <path d="M12 3v18" stroke-dasharray="1.5 2" />
                                    <path d="M9 6H5v12h4M15 6h4v12h-4M8 9l-3 3 3 3M16 9l3 3-3 3" />
                                </svg>
                            </button>
                            <details id="viewer-download-menu" class="viewer-download-menu">
                                <summary class="scene-action-button" role="button" aria-haspopup="true" aria-expanded="false" data-i18n-attrs="aria-label:explorer.downloads.open;data-tooltip:explorer.downloads.open">
                                    <svg viewBox="0 0 24 24" aria-hidden="true">
                                        <path d="M12 3v11m0 0 4-4m-4 4-4-4M5 15v4h14v-4" />
                                    </svg>
                                </summary>
                                <div class="viewer-download-options" role="group" data-i18n-attrs="aria-label:explorer.downloads.options-label">
                                    <button type="button" data-viewer-download data-scale="1" data-transparent="false">
                                        <strong data-i18n="explorer.downloads.background.title"></strong>
                                        <span data-i18n="explorer.downloads.background.description"></span>
                                    </button>
                                    <button type="button" data-viewer-download data-scale="1" data-transparent="true">
                                        <strong data-i18n="explorer.downloads.transparent.title"></strong>
                                        <span data-i18n="explorer.downloads.transparent.description"></span>
                                    </button>
                                    <button type="button" data-viewer-download data-scale="2" data-transparent="false">
                                        <strong data-i18n="explorer.downloads.high-resolution.title"></strong>
                                        <span data-i18n="explorer.downloads.high-resolution.description"></span>
                                    </button>
                                    <button type="button" data-viewer-download data-scale="2" data-transparent="true">
                                        <strong data-i18n="explorer.downloads.high-resolution-transparent.title"></strong>
                                        <span data-i18n="explorer.downloads.high-resolution-transparent.description"></span>
                                    </button>
                                    <span class="viewer-download-section" data-i18n="explorer.downloads.activation-section"></span>
                                    <button type="button" data-viewer-download data-scale="1" data-transparent="false" data-include-activation="true">
                                        <strong data-i18n="explorer.downloads.activation.title"></strong>
                                        <span data-i18n="explorer.downloads.activation.description"></span>
                                    </button>
                                    <button type="button" data-viewer-download data-scale="2" data-transparent="false" data-include-activation="true">
                                        <strong data-i18n="explorer.downloads.activation-high-resolution.title"></strong>
                                        <span data-i18n="explorer.downloads.activation-high-resolution.description"></span>
                                    </button>
                                    <p id="viewer-download-status" class="viewer-download-status" aria-live="polite"></p>
                                </div>
                            </details>
                            <button id="reset-view" class="scene-action-button" type="button" data-i18n-attrs="aria-label:explorer.actions.reset-view;data-tooltip:explorer.actions.reset-view">
                                <svg viewBox="0 0 24 24" aria-hidden="true">
                                    <path d="M7.4 5.4A8 8 0 1 1 4.7 14" />
                                    <path d="M8 10 4 6l4-4" />
                                </svg>
                            </button>
                        </div>
                        <div id="capacity-view-loading" class="capacity-view-loading hidden" role="status" aria-live="polite">
                            <span aria-hidden="true"></span>
                            <strong data-i18n="explorer.status.loading-posture"></strong>
                        </div>
                        <div id="geometry-legend" class="scene-legend" data-i18n-attrs="aria-label:explorer.legend.aria-label">
                            <span><i class="bone-key"></i><span id="active-region-legend" data-i18n="explorer.legend.focused-region"></span></span>
                            <span><i class="context-key"></i><span data-i18n="explorer.legend.whole-body-context"></span></span>
                            <span><i class="path-key"></i><span id="muscle-rendering-legend" data-i18n="explorer.legend.anatomical-bodies"></span></span>
                            <span id="selected-path-legend" class="hidden"><i class="selected-key"></i><span data-i18n="explorer.legend.selected"></span></span>
                        </div>
                        <section id="capacity-angle-overlay" class="capacity-angle-overlay" data-i18n-attrs="aria-label:assessment.position-angles.aria-label">
                            <strong data-i18n="assessment.position-angles.title"></strong>
                            <dl id="capacity-angle-grid"></dl>
                        </section>
                        <section id="activation-panel" class="viewer-drawer activation-panel static-source" data-i18n-attrs="aria-label:explorer.activations.aria-label">
                            <div id="activation-legend" class="activation-legend" data-i18n-attrs="aria-label:explorer.activations.scale-label">
                                <div class="legend-heading">
                                    <div class="legend-title">
                                        <strong data-i18n="explorer.activations.scale-title"></strong>
                                        <span>0–1</span>
                                    </div>
                                </div>
                                <div class="activation-ramp" aria-hidden="true"></div>
                                <div class="activation-labels"><span>0</span><span>0.5</span><span>1</span></div>
                                <small data-i18n="explorer.activations.nonlinear"></small>
                                <button id="toggle-activation-panel" class="text-button activation-list-toggle" type="button" aria-controls="activation-panel-content" aria-expanded="true" data-i18n="common.actions.hide-list"></button>
                            </div>
                            <div id="activation-panel-content" class="drawer-content">
                                <div id="activation-empty" class="effort-empty hidden">
                                    <strong data-i18n="common.status.calculating"></strong>
                                    <span data-i18n="explorer.activations.waiting"></span>
                                </div>
                                <div id="activation-ranking" class="activation-ranking"></div>
                                <button id="toggle-all-activations" class="text-button activation-ranking-more hidden" type="button" aria-expanded="false" data-i18n="explorer.activations.show-all"></button>
                            </div>
                        </section>

                        <section id="muscle-panel" class="viewer-drawer muscle-panel hidden" aria-labelledby="muscle-title">
                            <header class="section-header drawer-header muscle-drawer-header">
                                <div class="muscle-heading">
                                    <h2 id="muscle-title" data-i18n="explorer.muscle-details.title"></h2>
                                    <small id="muscle-model-id" data-i18n="explorer.muscle-details.model-id"></small>
                                </div>
                                <select id="muscle-select" data-i18n-attrs="aria-label:explorer.muscle-details.selected-label"></select>
                                <button id="toggle-muscle-panel" class="text-button" type="button" aria-controls="muscle-panel-content" aria-expanded="true" data-i18n="common.actions.hide"></button>
                                <button id="back-to-activations" class="text-button muscle-back-button" type="button" data-i18n="explorer.muscle-details.back"></button>
                            </header>
                            <div id="muscle-panel-content" class="drawer-content">
                            <dl class="key-readings">
                                <div>
                                    <dt data-i18n="explorer.muscle-details.path-length"></dt>
                                    <dd><strong id="muscle-length">—</strong> <span>cm</span></dd>
                                </div>
                                <div>
                                    <dt data-i18n="explorer.muscle-details.path-points"></dt>
                                    <dd><strong id="path-points">—</strong></dd>
                                </div>
                                <div id="activation-reading" class="activation-reading hidden">
                                    <dt data-i18n="explorer.muscle-details.activation"></dt>
                                    <dd><strong id="muscle-activation">—</strong> <span>0–1</span></dd>
                                </div>
                                <div id="force-reading" class="activation-reading hidden">
                                    <dt data-i18n="explorer.muscle-details.force"></dt>
                                    <dd><strong id="muscle-force">—</strong> <span>N</span></dd>
                                </div>
                            </dl>
                            <h3 data-i18n="explorer.muscle-details.moment-arms"></h3>
                            <div id="moment-arms" class="moment-arms"></div>
                            </div>
                        </section>

                        <div id="loading" class="loading" role="status" aria-live="polite">
                            <span class="spinner" aria-hidden="true"></span>
                            <span id="loading-text" data-i18n="explorer.status.loading-model"></span>
                        </div>
                    </div>

                    <aside id="pose-panel" class="pose-dock" aria-labelledby="pose-title">
                        <section class="region-picker" data-i18n-attrs="aria-label:explorer.regions.controls-label">
                            <label id="region-picker-title" for="focus-region" data-i18n="explorer.regions.picker-label"></label>
                            <select id="focus-region" aria-describedby="region-scope" disabled></select>
                            <p id="region-scope" data-i18n="explorer.regions.loading"></p>
                            <p id="region-support-note" class="region-support-note"></p>
                        </section>
                        <section id="back-presentation-controls" class="region-presentation-controls hidden" data-i18n-attrs="aria-label:explorer.back.presentation-label">
                            <div class="presentation-control-row">
                                <span data-i18n="explorer.back.view"></span>
                                <div class="segmented-control" role="group" data-i18n-attrs="aria-label:explorer.back.direction-label">
                                    <button type="button" data-region-view="back" aria-pressed="true" data-i18n="explorer.back.directions.back"></button>
                                    <button type="button" data-region-view="front" aria-pressed="false" data-i18n="explorer.back.directions.front"></button>
                                    <button type="button" data-region-view="side" aria-pressed="false" data-i18n="explorer.back.directions.side"></button>
                                </div>
                            </div>
                            <label class="presentation-control-row" for="back-muscle-filter">
                                <span data-i18n="common.nouns.muscles"></span>
                                <select id="back-muscle-filter">
                                    <option value="back" data-i18n="explorer.back.filters.back"></option>
                                    <option value="extensors" data-i18n="explorer.back.filters.extensors"></option>
                                    <option value="multifidus" data-i18n="explorer.back.filters.multifidus"></option>
                                    <option value="ql" data-i18n="explorer.back.filters.ql"></option>
                                    <option value="core" data-i18n="explorer.back.filters.core"></option>
                                    <option value="overview" data-i18n="explorer.back.filters.overview"></option>
                                </select>
                            </label>
                        </section>
                        <header class="pose-dock-header">
                            <h2 id="pose-title" data-i18n="explorer.pose.title"></h2>
                            <div id="position-status" class="position-status manual" role="status" aria-live="polite">
                                <strong data-i18n="common.status.preparing"></strong>
                                <span data-i18n="common.status.loading-model"></span>
                            </div>
                            <button id="reset-pose" class="text-button" type="button" data-i18n="common.actions.reset"></button>
                            <button id="toggle-preset-library" class="library-button" type="button" aria-controls="static-presets" aria-expanded="false">
                                <svg viewBox="0 0 24 24" aria-hidden="true">
                                    <path d="M3.5 5.5c2.8-.7 5.6-.2 8 1.5v12c-2.4-1.7-5.2-2.2-8-1.5zM20.5 5.5c-2.8-.7-5.6-.2-8 1.5v12c2.4-1.7 5.2-2.2 8-1.5z"/>
                                </svg>
                                <span data-i18n="explorer.presets.button"></span>
                                <small id="preset-count">—</small>
                            </button>
                        </header>
                        <div class="pose-viewer-controls" data-i18n-attrs="aria-label:explorer.controls.aria-label">
                            <div class="toolbar-group source-group">
                                <span id="analysis-source-title" class="toolbar-label" data-i18n="explorer.controls.geometry"></span>
                                <div class="source-controls">
                                    <div class="layer-toggle-list" role="group" aria-labelledby="analysis-source-title">
                                        <button id="toggle-context" class="layer-toggle active" type="button" aria-pressed="true" data-i18n="explorer.controls.body-context"></button>
                                        <button id="toggle-long-origins" class="layer-toggle" type="button" aria-pressed="false" data-i18n="explorer.controls.extended-paths"></button>
                                    </div>
                                </div>
                            </div>
                            <div class="toolbar-group">
                                <span class="toolbar-label" data-i18n="explorer.controls.muscle-view"></span>
                                <div class="path-view-switch" role="group" data-i18n-attrs="aria-label:explorer.controls.rendering-label">
                                    <button id="render-anatomical-bodies" class="active" type="button" aria-pressed="true" data-i18n="explorer.controls.anatomical"></button>
                                    <button id="render-path-lines" type="button" aria-pressed="false" data-i18n="explorer.controls.path-lines"></button>
                                </div>
                            </div>
                            <div class="toolbar-group">
                                <span class="toolbar-label" data-i18n="common.nouns.muscles"></span>
                                <div class="path-view-switch" role="group" data-i18n-attrs="aria-label:explorer.controls.path-view-label">
                                    <button id="view-all-muscles" class="active" type="button" aria-pressed="true" data-i18n="explorer.controls.all-paths"></button>
                                    <button id="view-one-muscle" type="button" aria-pressed="false" data-i18n="explorer.controls.inspect-one"></button>
                                </div>
                            </div>
                        </div>
                        <section id="static-presets" class="preset-section preset-catalog hidden" aria-labelledby="preset-title">
                            <div class="preset-heading">
                                <h3 id="preset-title" data-i18n="explorer.presets.title"></h3>
                                <span id="preset-summary" data-i18n="explorer.presets.reference"></span>
                            </div>
                            <p id="preset-note" class="catalog-note" data-i18n="explorer.presets.note"></p>
                            <div id="pose-presets" class="preset-groups"></div>
                        </section>
                        <div id="coordinate-controls" class="coordinate-controls compact"></div>
                        <div id="static-actions" class="static-actions">
                        <button id="calculate-static" class="quiet-button hidden" type="button" data-i18n="common.actions.try-again"></button>
                            <details class="solver-details">
                            <summary data-i18n="explorer.solver.title"></summary>
                                <dl class="solver-mini-readout" data-i18n-attrs="aria-label:explorer.solver.quality-label">
                                <div data-i18n-attrs="title:explorer.solver.balance-description"><dt data-i18n="explorer.solver.balance-error"></dt><dd id="solver-residual">—</dd></div>
                                <div data-i18n-attrs="title:explorer.solver.reserve-description"><dt data-i18n="explorer.solver.reserve-torque"></dt><dd id="solver-reserve">—</dd></div>
                                </dl>
                            </details>
                        </div>
                    </aside>
                </div>
            </section>
        </section>

        <section id="diagnosis-workspace" class="diagnosis-workspace hidden" role="tabpanel" aria-labelledby="tab-diagnosis">
            <section class="diagnosis-records panel" aria-labelledby="diagnosis-records-title">
                <header>
                    <div>
                        <h2 id="diagnosis-records-title">
                            <svg class="diagnosis-records-icon" viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M9 6h11M9 12h11M9 18h11"></path>
                                <path d="M4 6h.01M4 12h.01M4 18h.01"></path>
                            </svg>
                            <span data-i18n="assessment.records.title"></span>
                        </h2>
                        <span id="diagnosis-draft-state" data-i18n="assessment.records.device-storage"></span>
                    </div>
                    <div class="diagnosis-record-actions">
                        <button id="diagnosis-delete-all-data" class="quiet-button" type="button" data-i18n="assessment.records.clear-data"></button>
                        <button id="diagnosis-new-assessment" class="quiet-button" type="button" data-i18n="assessment.records.new-assessment"></button>
                    </div>
                </header>
                <div id="diagnosis-saved-report-list"></div>
                <p id="diagnosis-records-privacy" class="diagnosis-records-privacy" data-i18n="assessment.records.privacy"></p>
            </section>

            <section id="diagnosis-privacy-overview" class="diagnosis-privacy-overview panel" aria-labelledby="diagnosis-privacy-overview-title">
                <header>
                        <p class="eyebrow" data-i18n="assessment.privacy.eyebrow"></p>
                        <h2 id="diagnosis-privacy-overview-title" data-i18n="assessment.privacy.title"></h2>
                        <p data-i18n="assessment.privacy.intro"></p>
                </header>
                <div class="diagnosis-privacy-overview-body">
                        <p data-i18n="assessment.privacy.no-server"></p>
                        <p data-i18n="assessment.privacy.no-cookies"></p>
                        <p data-i18n="assessment.privacy.deletion"></p>
                </div>
                <div class="diagnosis-privacy-start">
                    <button id="diagnosis-start" class="primary-button" type="button" data-i18n="common.actions.start"></button>
                </div>
            </section>

            <section id="diagnosis-safety-landing" class="diagnosis-safety-landing panel hidden" aria-labelledby="diagnosis-safety-title">
                <header>
                        <p class="eyebrow" data-i18n="assessment.safety.eyebrow"></p>
                        <h2 id="diagnosis-safety-title" data-i18n="assessment.safety.title"></h2>
                        <p data-i18n="assessment.safety.intro"></p>
                </header>
                <div class="diagnosis-safety-body">
                    <div class="diagnosis-safety-intro">
                            <h3 data-i18n="assessment.safety.before-title"></h3>
                            <p data-i18n="assessment.safety.urgent-boundary"></p>
                            <p data-i18n="assessment.safety.diagnosis-boundary"></p>
                    </div>
                    <div>
                        <div id="diagnosis-safety-form"></div>
                        <div id="diagnosis-safety-warning" class="diagnosis-stop-warning hidden" role="alert"></div>
                        <div class="diagnosis-safety-footer">
                        <span id="diagnosis-safety-state" data-i18n="assessment.safety.review-required"></span>
                        <button id="diagnosis-continue" class="primary-button" type="button" disabled data-i18n="common.actions.continue"></button>
                        </div>
                    </div>
                </div>
            </section>

            <section id="diagnosis-intake" class="diagnosis-intake panel hidden" aria-labelledby="diagnosis-intake-title">
                <header>
                        <p class="eyebrow" data-i18n="assessment.intake.eyebrow"></p>
                        <h2 id="diagnosis-intake-title" data-i18n="assessment.intake.title"></h2>
                        <p data-i18n="assessment.intake.intro"></p>
                </header>
                <form id="diagnosis-intake-form">
                    <section class="diagnosis-intake-section" aria-labelledby="intake-person-title">
                        <div class="diagnosis-intake-heading">
                                <h3 id="intake-person-title" data-i18n="assessment.intake.patient-details"></h3>
                                <span data-i18n="assessment.intake.required-note"></span>
                        </div>
                        <div class="diagnosis-intake-grid">
                            <label class="diagnosis-field span-2"><span data-i18n="assessment.intake.fields.name.label"></span><input name="name" type="text" maxlength="120" autocomplete="off" data-i18n-attrs="placeholder:assessment.intake.fields.name.placeholder"></label>
                            <label class="diagnosis-field"><span data-i18n="assessment.intake.fields.age.label"></span><input name="ageYears" type="number" min="1" max="120" step="1" inputmode="numeric" required></label>
                            <label class="diagnosis-field"><span data-i18n="assessment.intake.fields.gender.label"></span><select name="gender" required>
