name: Verify and deploy medical tools

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify-muscles:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify the biomechanics research tool static release
        shell: powershell
        working-directory: projects/muscles
        run: >-
          powershell.exe -NoProfile -ExecutionPolicy Bypass
          -File .\release.ps1

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify-muscles
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Assemble static catalog
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .temp/site/en/tools/muscles .temp/site/es/tools/muscles .temp/site/de/tools/muscles .temp/site/el/tools/muscles .temp/site/cs/tools/muscles .temp/site/zh/tools/muscles .temp/site/muscles
          cp -R web/. .temp/site/
          cp -R projects/muscles/public/. .temp/site/en/tools/muscles/
          cp -R projects/muscles/public/. .temp/site/es/tools/muscles/
          cp -R projects/muscles/public/. .temp/site/de/tools/muscles/
          cp -R projects/muscles/public/. .temp/site/el/tools/muscles/
          cp -R projects/muscles/public/. .temp/site/cs/tools/muscles/
          cp -R projects/muscles/public/. .temp/site/zh/tools/muscles/
          node projects/muscles/tools/build-localized-pages.mjs --source projects/muscles/public --output .temp/site
          touch .temp/site/.nojekyll

      - name: Check assembled routes
        shell: bash
        run: |
          set -euo pipefail
          test -f .temp/site/index.html
          test -f .temp/site/waajacu_medical_no_bg.png
          test -f .temp/site/en/tools/muscles/index.html
          test -f .temp/site/en/tools/muscles/bootstrap.js
          test -f .temp/site/en/tools/muscles/i18n.js
          test -f .temp/site/en/tools/muscles/locales/en.json
          test -f .temp/site/es/tools/muscles/index.html
          test -f .temp/site/es/tools/muscles/bootstrap.js
          test -f .temp/site/es/tools/muscles/i18n.js
          test -f .temp/site/es/tools/muscles/locales/es.json
          test -f .temp/site/de/tools/muscles/index.html
          test -f .temp/site/de/tools/muscles/bootstrap.js
          test -f .temp/site/de/tools/muscles/i18n.js
          test -f .temp/site/de/tools/muscles/locales/de.json
          test -f .temp/site/el/tools/muscles/index.html
          test -f .temp/site/el/tools/muscles/bootstrap.js
          test -f .temp/site/el/tools/muscles/i18n.js
          test -f .temp/site/el/tools/muscles/locales/el.json
          test -f .temp/site/cs/tools/muscles/index.html
          test -f .temp/site/cs/tools/muscles/bootstrap.js
          test -f .temp/site/cs/tools/muscles/i18n.js
          test -f .temp/site/cs/tools/muscles/locales/cs.json
          test -f .temp/site/zh/tools/muscles/index.html
          test -f .temp/site/zh/tools/muscles/bootstrap.js
          test -f .temp/site/zh/tools/muscles/i18n.js
          test -f .temp/site/zh/tools/muscles/locales/zh-Hans.json
          test -f .temp/site/es/tools/muscles/vendor/mujoco.wasm
          test -f .temp/site/de/tools/muscles/vendor/mujoco.wasm
          test -f .temp/site/el/tools/muscles/vendor/mujoco.wasm
          test -f .temp/site/cs/tools/muscles/vendor/mujoco.wasm
          test -f .temp/site/zh/tools/muscles/vendor/mujoco.wasm
          grep -Fq '<html class="i18n-loading" lang="en" dir="ltr">' .temp/site/en/tools/muscles/index.html
          grep -Fq '<html class="i18n-loading" lang="es" dir="ltr">' .temp/site/es/tools/muscles/index.html
          grep -Fq '<html class="i18n-loading" lang="de" dir="ltr">' .temp/site/de/tools/muscles/index.html
          grep -Fq '<html class="i18n-loading" lang="el" dir="ltr">' .temp/site/el/tools/muscles/index.html
          grep -Fq '<html class="i18n-loading" lang="cs" dir="ltr">' .temp/site/cs/tools/muscles/index.html
          grep -Fq '<html class="i18n-loading" lang="zh-Hans" dir="ltr">' .temp/site/zh/tools/muscles/index.html
          test -f .temp/site/en/tools/muscles/vendor/mujoco.wasm
          test -f .temp/site/muscles/index.html
          grep -Fq 'href="./en/tools/muscles/"' .temp/site/index.html
          grep -Fq '../en/tools/muscles/' .temp/site/muscles/index.html
          if find .temp/site -type l -print -quit | grep -q .; then
            echo 'The Pages artifact must not contain symbolic links.' >&2
            exit 1
          fi
          if find .temp/site -mindepth 1 -type d \( -name tmp -o -name .temp \) -print -quit | grep -q .; then
            echo 'The Pages artifact unexpectedly contains temporary content.' >&2
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .temp/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
